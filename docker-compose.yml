# ============================================================
# PipelineFace — Pipeline de Extração de Conhecimento
# ============================================================
# Serviços em container:
#   1. scraper   → Coleta mídia de perfis do Facebook (Playwright + yt-dlp)
#   2. whisper   → Transcrição de áudio (speech-to-text / ASR)
#   3. mongodb   → Banco de dados de documentos para a aplicação web
#
# Processamento de IA (Visão + Texto) e Aplicação Web:
#   - pipeline   → Executado via Python nativo (`python3 pipeline.py`)
#   - web        → Aplicação Web FastAPI + Tailwind CSS (`./scripts/start-web.sh`)
#   - ollama     → Modelos LLM locais (`moondream` e `qwen2.5:3b`) no host
# ============================================================

services:

  # ----------------------------------------------------------
  # SCRAPER: Coleta automatizada de mídia do Facebook
  # ----------------------------------------------------------
  scraper:
    image: pipelineface-scraper:latest
    build:
      context: ./scraper
      dockerfile: Containerfile
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Sao_Paulo
      - SCRAPER_MAX_SCROLLS=${SCRAPER_MAX_SCROLLS:-50}
      - SCRAPER_SESSION_DIR=/data/scraper/session
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    networks:
      - pipeline-net

  # ----------------------------------------------------------
  # WHISPER: Transcrição de áudio (ASR / Speech-to-Text)
  # ----------------------------------------------------------
  whisper:
    image: docker.io/onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=faster_whisper
    restart: unless-stopped
    networks:
      - pipeline-net

  # ----------------------------------------------------------
  # MONGODB: Banco de dados para a Aplicação Web
  # ----------------------------------------------------------
  mongodb:
    image: docker.io/library/mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    restart: unless-stopped
    networks:
      - pipeline-net

# ----------------------------------------------------------
# Rede compartilhada entre os serviços
# ----------------------------------------------------------
networks:
  pipeline-net:
    driver: bridge
