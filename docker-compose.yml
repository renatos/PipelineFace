# ============================================================
# PipelineFace — Pipeline de Extração de Conhecimento
# ============================================================
# Serviços em container:
#   1. scraper   → Coleta mídia de perfis do Facebook (Playwright + yt-dlp)
#   2. n8n       → Orquestração do pipeline de processamento
#   3. whisper   → Transcrição de áudio (speech-to-text)
#   4. postgres  → Banco de dados para persistência do N8N
#
# Serviço nativo no host (mais performático com GPU):
#   - ollama    → Modelos LLM locais (visão + texto) — roda direto no host
# ============================================================

services:

  # ----------------------------------------------------------
  # SCRAPER: Coleta automatizada de mídia do Facebook
  # ----------------------------------------------------------
  scraper:
    image: pipelineface-scraper:latest
    build:
      context: ./scraper
      dockerfile: Containerfile
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Sao_Paulo
      - SCRAPER_MAX_SCROLLS=${SCRAPER_MAX_SCROLLS:-50}
      - SCRAPER_SESSION_DIR=/data/scraper/session
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    networks:
      - pipeline-net

  # ----------------------------------------------------------
  # N8N: Orquestração de workflows
  # Conecta ao Ollama nativo do host via host.docker.internal
  # ----------------------------------------------------------
  n8n:
    image: pipelineface-n8n:latest
    build:
      context: .
      dockerfile: Containerfile.n8n
    ports:
      - "5678:5678"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_pipeline_2026}
      - N8N_RUNNERS_ENABLED=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      # Liberar sandbox para acessar o sistema de arquivos local e fazer requests HTTP com multipart
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,child_process,http,form-data
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true


      # Ollama roda no host, acessível via host.docker.internal
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./data:/data
    depends_on:
      - postgres
      - whisper
    restart: unless-stopped

    networks:
      - pipeline-net

  # ----------------------------------------------------------
  # WHISPER: Transcrição de áudio (ASR / Speech-to-Text)
  # API REST compatível com OpenAI Whisper.
  # Modelo 'base' é bom equilíbrio entre velocidade e qualidade.
  # ----------------------------------------------------------
  whisper:
    image: docker.io/onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=faster_whisper
    restart: unless-stopped
    networks:
      - pipeline-net

  # ----------------------------------------------------------
  # POSTGRESQL: Banco de dados para o N8N
  # Armazena workflows, execuções e credenciais.
  # ----------------------------------------------------------
  postgres:
    image: docker.io/postgres:16-alpine
    ports:
      - "5432:5432"  # Apenas para debug — remova em produção
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_pipeline_2026}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    restart: unless-stopped
    networks:
      - pipeline-net

# ----------------------------------------------------------
# Rede compartilhada entre todos os serviços
# ----------------------------------------------------------
networks:
  pipeline-net:
    driver: bridge
