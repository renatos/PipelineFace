version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: pipelineface_web_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - WHISPER_URL=http://host.containers.internal:9000/asr
      - OLLAMA_URL=http://host.containers.internal:11434/api/chat
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: pipelineface_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
